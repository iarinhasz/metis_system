[project]
name = "metis"
version = "0.1.0"
description = "Avaliador de artigos científicos com três avaliadores e um juiz"
requires-python = ">=3.14,<3.15"
dependencies = [
    "celery[redis]>=5.5,<6",
    "django>=6,<7",
    "django-ninja>=1.4,<2",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
flower = ["flower>=2.0,<3"]

[dependency-groups]
dev = [
    "celery-types>=0.23,<1",
    "django-stubs[compatible-mypy]>=5.2,<6",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.11,<1",
]
analysis = [
    "ipykernel>=7,<8",
    "jupyterlab>=4,<5",
    "pandas>=2.2,<3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
include = ["projects/**/*.py", "manage.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.getenv" = { msg = "Leia variáveis de ambiente somente em projects.correction.metis.config." }
"os.environ" = { msg = "Leia variáveis de ambiente somente em projects.correction.metis.config." }

[tool.ruff.lint.per-file-ignores]
"manage.py" = ["TID251"]
"projects/correction/manage.py" = ["TID251"]
"projects/correction/metis/wsgi.py" = ["TID251"]
"projects/correction/metis/celery.py" = ["TID251"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
strict = true
exclude = ["dataset_project/"]

[tool.django-stubs]
django_settings_module = "projects.correction.metis.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "projects.correction.metis.settings"
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra"
